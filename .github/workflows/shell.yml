name: SEQ.3 app (web shell)
# Builds the SEQ.3 app (Shell/: the web app in a native shell) for iPad/iPhone and Mac, runs its self-test on an iPad
# and an iPhone simulator and on the Mac (twice each, so the second run proves saved data survives a restart), takes
# screenshots and publishes the simulator results to shell-out-<branch> and the Mac results plus the Mac app to shell-mac-<branch>.
on:
  push:
    paths: ['Shell/**', '.github/workflows/shell.yml']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: cd Shell && xcodegen && mkdir -p ../shell-out
      - name: Pack the ready Xcode project (to build onto a real iPad from a Mac without XcodeGen)
        run: ditto -c -k --sequesterRsrc --keepParent Shell "shell-out/SEQ3-Xcode.zip"
      - name: Build and self-test the Mac app (Mac Catalyst, ad-hoc signed)
        timeout-minutes: 20
        run: |
          cd Shell
          set +e
          xcodebuild -project SEQ3.xcodeproj -scheme SEQ3 -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath ddm \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO build > mac.log 2>&1
          rc=$?
          tail -20 mac.log
          grep -E "error:" mac.log | sort -u | head -20 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' \
            | while IFS= read -r l; do echo "::error::$l"; done
          [ $rc -eq 0 ] || exit $rc
          APP=$(find ddm -name "SEQ3.app" -path "*maccatalyst*" | head -1)
          echo "app: $APP"
          codesign --force --deep -s - "$APP"
          for k in 1 2; do
            "$APP/Contents/MacOS/SEQ3" -selftest > ../shell-out/mac_stdout_$k.txt 2>&1 &
            pid=$!
            sleep 35
            screencapture -x ../shell-out/mac_$k.png || true
            kill $pid 2>/dev/null; sleep 2
            sed -n '/SEQ3-SELFTEST-BEGIN/,/SEQ3-SELFTEST-END/p' ../shell-out/mac_stdout_$k.txt | sed '1d;$d' > ../shell-out/mac_selftest_$k.json
            [ -s ../shell-out/mac_selftest_$k.json ] || echo '{"missing":true}' > ../shell-out/mac_selftest_$k.json
          done
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../shell-out/SEQ.3 (Mac).zip"
          ls -la ../shell-out
      - name: Check the self-test results
        if: always()
        run: python3 Shell/tools/check_selftest.py shell-out mac | tee shell-out/summary.txt
      - name: Publish to the shell-mac branch
        if: always()
        run: |
          cd shell-out
          # GitHub takes files up to 100 MB; with the sound pack the zips are bigger, so they go up in 90 MB parts
          # (put back together with: cat "SEQ.3 (Mac).zip.part-"* > "SEQ.3 (Mac).zip")
          for z in *.zip; do [ -f "$z" ] || continue; if [ $(stat -f %z "$z") -gt 94000000 ]; then split -b 90m "$z" "$z.part-" && rm "$z"; fi; done
          ls -la
          git init -q && git checkout -q -b "shell-mac-${GITHUB_REF_NAME}"
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "shell mac ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shell-mac-${GITHUB_REF_NAME}"
      - name: Fail if a self-test failed
        run: grep -q "^ALL OK" shell-out/summary.txt

  shell:
    runs-on: macos-15
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: cd Shell && xcodegen
      - name: Build for the iOS simulator
        run: |
          cd Shell
          mkdir -p ../shell-out
          set +e
          xcodebuild -project SEQ3.xcodeproj -scheme SEQ3 -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          tail -30 build.log
          grep -E "error:|warning:" build.log | grep -v "ld: warning" | sort -u | head -40 \
            | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' | tee ../shell-out/ios_diagnostics.txt \
            | while IFS= read -r l; do case "$l" in *error:*) echo "::error::$l";; *) echo "::warning::$l";; esac; done
          exit $rc
      - name: Self-test on the iPad and iPhone simulators
        timeout-minutes: 60
        run: |
          cd Shell
          T() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no `timeout`
          APP=$(find dd -name "SEQ3.app" -path "*iphonesimulator*" | head -1)
          echo "app: $APP"
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices'];pre=sys.argv[1:]
          ok=[x for k,v in d.items() if 'iOS' in k for x in v]
          print(next(x['udid'] for p in pre for x in ok if x['name'].startswith(p)))" "$@"; }
          run() {
            n=$1; U=$2
            echo "== $n $U"
            xcrun simctl boot $U || true; T 400 xcrun simctl bootstatus $U -b || echo "$n: boot status timed out"
            T 180 xcrun simctl install $U "$APP" || echo "$n: install failed"
            for k in 1 2; do
              D=$(T 60 xcrun simctl get_app_container $U se.blonda.seq3 data || true)
              rm -f "$D/Documents/selftest.json"
              t0=$(date +%s)
              # (a launch that hangs past its time limit must not end the whole step: the shell runs with -e)
              rc=0; T 120 xcrun simctl launch $U se.blonda.seq3 -selftest > ../shell-out/${n}_launch_$k.txt 2>&1 || rc=$?; echo "launch exit $rc" >> ../shell-out/${n}_launch_$k.txt
              # wait for the app's report (the simulators here have no GPU, so the animated app is slow – give it time)
              for i in $(seq 1 150); do [ -f "$D/Documents/selftest.json" ] && break; sleep 2; done
              T 20 xcrun simctl spawn $U launchctl list 2>/dev/null | grep -i seq3 >> ../shell-out/${n}_launch_$k.txt || echo "app process: not running" >> ../shell-out/${n}_launch_$k.txt
              echo "$n run $k: report after $(( $(date +%s) - t0 )) s"
              if [ -f "$D/Documents/selftest.json" ]; then mv "$D/Documents/selftest.json" ../shell-out/${n}_selftest_$k.json
              else echo '{"missing":true}' > ../shell-out/${n}_selftest_$k.json; fi
              T 150 xcrun simctl io $U screenshot ../shell-out/${n}_$k.png || echo "$n run $k: screenshot timed out"
              T 30 xcrun simctl terminate $U se.blonda.seq3 || true
              sleep 2
            done
            T 60 xcrun simctl spawn $U log show --last 4m --predicate 'process == "SEQ3"' --style compact 2>/dev/null \
              | grep -E "SEQ3|rror|rash" | tail -100 > ../shell-out/${n}_log.txt || true
            xcrun simctl shutdown $U || true
            # crash reports from the simulator end up on the host
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/SEQ3* 2>/dev/null | head -3); do cp "$f" ../shell-out/${n}_crash_$(basename "$f") ; done
          }
          run ipad "$(pick 'iPad Pro 13' 'iPad Pro (12.9' 'iPad Air 13' 'iPad')"
          run iphone "$(pick 'iPhone 16 Pro' 'iPhone 17 Pro' 'iPhone 16' 'iPhone')"
      - name: Check the self-test results
        if: always()
        run: python3 Shell/tools/check_selftest.py shell-out ipad iphone | tee shell-out/summary.txt
      - name: Publish to the shell-out branch
        if: always()
        run: |
          cd shell-out
          git init -q && git checkout -q -b "shell-out-${GITHUB_REF_NAME}"
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "shell ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shell-out-${GITHUB_REF_NAME}"
      - name: Fail if a self-test failed
        run: grep -q "^ALL OK" shell-out/summary.txt
