name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: cmake -S Core -B Core/build -DCMAKE_BUILD_TYPE=Release && cmake --build Core/build -j4
      - name: Host / threading stress test
        run: cd Core/build && ./hosttest ../../App/Resources/default_project.json
      - name: Render 8 s of the default song
        run: cd Core/build && ./songrender ../../App/Resources/default_project.json 8 song.f32
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen
      - name: Build for iOS Simulator (no signing)
        run: |
          cd App
          set +e
          xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          tail -40 build.log
          # surface compiler errors as annotations (readable through the API)
          grep -E -A12 "Undefined symbols" build.log | head -24 >> errs0.txt
          grep -E "error:" build.log | sort -u | head -40 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > errs.txt
          cat errs0.txt 2>/dev/null >> errs.txt
          while IFS= read -r l; do echo "::error::$l"; done < errs.txt
          grep -E "warning:" build.log | grep -v "ld: warning" | sort -u | head -30 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > warns.txt
          while IFS= read -r l; do echo "::warning::$l"; done < warns.txt
          exit $rc
