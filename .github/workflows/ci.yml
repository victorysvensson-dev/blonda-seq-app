name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: cmake -S Core -B Core/build -DCMAKE_BUILD_TYPE=Release && cmake --build Core/build -j4
      - name: Host / threading stress test
        run: cd Core/build && ./hosttest ../../App/Resources/default_project.json
      - name: Live-note release test (all engines)
        run: cd Core/build && ./livetest ../../App/Resources/default_project.json && ./savetest ../../App/Resources/default_project.json && ./edittest ../../App/Resources/default_project.json
      - name: Render 8 s of the default song
        run: cd Core/build && ./songrender ../../App/Resources/default_project.json 8 song.f32
  akai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Akai library and tests
        run: cmake -S Akai -B Akai/build -DCMAKE_BUILD_TYPE=Release && cmake --build Akai/build -j4
      - name: Akai tests (protocol, held notes, real-time safety, levels, app logic)
        run: ./Akai/build/akai_test
      - name: Cross-build the MPC Sample binary (static aarch64)
        run: pip install ziglang && ZIG="python3 -m ziglang" Akai/platform/mpcsample/build.sh
      - name: Self test of the ARM binary under emulation
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static && qemu-aarch64-static Akai/build-mpcsample/blonda-akai --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: blonda-akai-mpcsample
          path: Akai/build-mpcsample/blonda-akai
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen
      - name: Build for iOS Simulator (no signing)
        run: |
          cd App
          set +e
          xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          tail -40 build.log
          # surface compiler errors as annotations (readable through the API)
          grep -E -A12 "Undefined symbols" build.log | head -24 >> errs0.txt
          grep -E "error:" build.log | sort -u | head -40 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > errs.txt
          cat errs0.txt 2>/dev/null >> errs.txt
          while IFS= read -r l; do echo "::error::$l"; done < errs.txt
          grep -E "warning:" build.log | grep -v "ld: warning" | sort -u | head -30 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > warns.txt
          while IFS= read -r l; do echo "::warning::$l"; done < warns.txt
          exit $rc
      - name: Run in the simulator and take screenshots
        timeout-minutes: 15
        run: |
          cd App
          T() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no `timeout`
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad Pro 13')))")
          xcrun simctl boot $UDID
          T 300 xcrun simctl bootstatus $UDID -b
          T 900 xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || (tail -30 sim.log; exit 1)
          APP=$(find dd -name "*.app" -path "*iphonesimulator*" | head -1)
          T 120 xcrun simctl install $UDID "$APP"
          T 30 xcrun simctl ui $UDID appearance dark || true
          mkdir -p ../ci-shots
          date; T 60 xcrun simctl launch $UDID se.blonda.seq -landscape || true
          sleep 8; date
          T 60 xcrun simctl io $UDID screenshot ../ci-shots/ipad_intro.png || echo "intro screenshot failed"
          T 30 xcrun simctl terminate $UDID se.blonda.seq || true
          T 60 xcrun simctl launch $UDID se.blonda.seq -landscape -autoplay || true
          sleep 8; date
          T 60 xcrun simctl io $UDID screenshot ../ci-shots/ipad.png || echo "screenshot failed"
          sleep 1
          T 60 xcrun simctl io $UDID screenshot ../ci-shots/ipad2.png || true
          for g in 0 1 2 3 4; do
            T 30 xcrun simctl terminate $UDID se.blonda.seq || true
            T 60 xcrun simctl launch $UDID se.blonda.seq -landscape -gallery $g || true; sleep 5
            T 60 xcrun simctl io $UDID screenshot ../ci-shots/synth_$g.png || true
          done
          date
          T 60 xcrun simctl spawn $UDID log show --last 2m --predicate 'process == "BLONDA SEQ"' --style compact 2>/dev/null | grep -v UIFocus | tail -60 > ../ci-shots/log.txt || true
          T 30 xcrun simctl shutdown $UDID || true
          # iPhone too
          PH=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 17 Pro')))")
          xcrun simctl boot $PH; T 300 xcrun simctl bootstatus $PH -b
          T 120 xcrun simctl install $PH "$APP"; T 30 xcrun simctl ui $PH appearance dark || true
          T 60 xcrun simctl launch $PH se.blonda.seq -autoplay || true; sleep 6
          T 60 xcrun simctl io $PH screenshot ../ci-shots/iphone.png || true
      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          mkdir -p ci-shots
          cd ci-shots
          git init -q && git checkout -q -b ci-shots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots

  mac:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Mac app (Mac Catalyst, Release, ad-hoc signed)
        run: |
          cd App && xcodegen
          set +e
          xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO build > mac.log 2>&1
          rc=$?
          tail -30 mac.log
          grep -E "error:" mac.log | sort -u | head -30 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > errs.txt
          while IFS= read -r l; do echo "::error::$l"; done < errs.txt
          exit $rc
      - name: Launch it and take a screenshot
        run: |
          cd App
          APP=$(find dd -name "*.app" -path "*maccatalyst*" -maxdepth 6 | head -1)
          echo "app: $APP"
          codesign --force --deep -s - "$APP"
          codesign -dv "$APP" 2>&1 | head -5
          lipo -info "$APP/Contents/MacOS/"* || true
          mkdir -p ../mac-out
          "$APP/Contents/MacOS/BLONDA SEQ" > ../mac-out/stdout0.txt 2>&1 &
          sleep 8
          screencapture -x ../mac-out/mac_intro.png || true
          pkill -f "BLONDA SEQ" || true
          sleep 2
          "$APP/Contents/MacOS/BLONDA SEQ" -autoplay > ../mac-out/stdout.txt 2>&1 &
          sleep 10
          screencapture -x ../mac-out/mac.png || true
          log show --last 1m --predicate 'process == "BLONDA SEQ"' --style compact 2>/dev/null | grep -E "DIAG|rror|crash" | tail -40 > ../mac-out/log.txt || true
          pkill -f "BLONDA SEQ" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../mac-out/BLONDA SEQ (Mac).zip"
          ls -la ../mac-out
      - name: Publish to the mac-build branch
        run: |
          cd mac-out
          git init -q && git checkout -q -b mac-build
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "mac build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mac-build
