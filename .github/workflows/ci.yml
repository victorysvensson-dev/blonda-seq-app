name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: cmake -S Core -B Core/build -DCMAKE_BUILD_TYPE=Release && cmake --build Core/build -j4
      - name: Host / threading stress test
        run: cd Core/build && ./hosttest ../../App/Resources/default_project.json
      - name: Render 8 s of the default song
        run: cd Core/build && ./songrender ../../App/Resources/default_project.json 8 song.f32
  ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen
      - name: Build for iOS Simulator (no signing)
        run: |
          cd App
          set +e
          xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          tail -40 build.log
          # surface compiler errors as annotations (readable through the API)
          grep -E -A12 "Undefined symbols" build.log | head -24 >> errs0.txt
          grep -E "error:" build.log | sort -u | head -40 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > errs.txt
          cat errs0.txt 2>/dev/null >> errs.txt
          while IFS= read -r l; do echo "::error::$l"; done < errs.txt
          grep -E "warning:" build.log | grep -v "ld: warning" | sort -u | head -30 | sed 's#^/Users/runner/work/blonda-seq-app/blonda-seq-app/##' > warns.txt
          while IFS= read -r l; do echo "::warning::$l"; done < warns.txt
          exit $rc
      - name: Run in the simulator and take screenshots
        run: |
          cd App
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad Pro 13')))")
          xcrun simctl boot $UDID
          xcrun simctl bootstatus $UDID -b
          xcodebuild -project BLONDA.xcodeproj -scheme BLONDA -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || (tail -30 sim.log; exit 1)
          APP=$(find dd -name "*.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl ui $UDID appearance dark || true
          xcrun simctl launch $UDID se.blonda.seq -autoplay
          sleep 6
          mkdir -p ../ci-shots
          xcrun simctl io $UDID screenshot ../ci-shots/ipad.png
          sleep 1.3
          xcrun simctl io $UDID screenshot ../ci-shots/ipad2.png
          xcrun simctl spawn $UDID log show --last 1m --predicate 'process == "BLONDA SEQ"' --style compact 2>/dev/null | tail -40 > ../ci-shots/log.txt || true
      - name: Publish screenshots to the ci-shots branch
        run: |
          cd ci-shots
          git init -q && git checkout -q -b ci-shots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
